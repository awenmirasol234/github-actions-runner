name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux, x64, ubuntu, docker]

    steps:
      - name: Check runner
        run: |
          echo "Runner connected successfully"
          echo "runner: $RUNNER_NAME"
          hostname
          docker version
          docker compose version

      - name: Connectivity health check
        run: |
          if docker ps --format '{{.Names}}' | grep -qx '<container_name>'; then
            docker exec '<container_name>' bash -c 'curl -fsS http://localhost:<port>/health'
          else
            echo 'No application container named <container_name>; skipping connectivity check'
          fi
        # Manual: docker exec -it <container_name> bash