services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped

    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:?ACCESS_TOKEN is not set in .env}
      REPO_URL: ${REPO_URL:?REPO_URL is not set in .env}
      RUNNER_SCOPE: repo
      RUNNER_NAME: ${RUNNER_NAME:?RUNNER_NAME is not set in .env}
      LABELS: ubuntu,docker
      RUNNER_WORKDIR: /tmp/runner/_work

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/tmp/runner