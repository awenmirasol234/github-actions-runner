services:
  github-runner:
    image: myoung34/github-runner:latest
    container_name: github-runner
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REPO_URL: https://github.com/awenmirasol234/github-actions-runner
      RUNNER_SCOPE: repo
      RUNNER_NAME: github-runner
      LABELS: ubuntu,docker
      RUNNER_WORKDIR: /tmp/runner/_work

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/tmp/runner